name: Query warehouse

# Ad-hoc read-only SQL against MotherDuck, for inspecting loaded data without
# a local setup. The owner's primary query surface is the MotherDuck web UI;
# this exists so results can be captured in a run log and shared.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SELECT statement to run"
        type: string
        required: true
      limit:
        description: "Max rows to print"
        type: string
        default: "60"

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb~=1.1" "pandas~=2.2"

      - name: Run query
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          QUERY_SQL: ${{ inputs.sql }}
          QUERY_LIMIT: ${{ inputs.limit }}
        run: python scripts/query.py
