name: Preflight

# Verifies cloud credentials and probes source reachability from a US-based
# runner. Run manually whenever credentials change or a source starts failing.
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Preflight needs only the connectivity libraries, not the document-
        # extraction stack — keeps this check fast.
        run: |
          python -m pip install --upgrade pip
          pip install "boto3~=1.35" "duckdb~=1.1" "httpx~=0.27" "pyyaml~=6.0"

      - name: Show runner location
        # Confirms which region we egress from — decides the geo-blocking question.
        run: |
          echo "Runner public IP and region:"
          curl -s --max-time 20 https://ipinfo.io/json || echo "(ipinfo unavailable)"

      - name: Run preflight
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/preflight.py
