name: S-014 Bondora

# European consumer loan-level data: 789k loans with a 12-month default target
# and realised repayment amounts.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Probe the source without downloading (true/false)"
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    # File is refreshed periodically; monthly is ample for a loan book.
    - cron: "0 5 8 * *"

concurrency:
  group: s014-bondora
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "boto3~=1.35" "duckdb~=1.1" "httpx~=0.27" "tenacity~=9.0" \
                      "pandas~=2.2" "pyarrow~=17.0" "pyyaml~=6.0" "openpyxl~=3.1"

      - name: Run pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ inputs.check_only }}" = "true" ]; then
            python pipelines/s014_bondora.py --check
          else
            python pipelines/s014_bondora.py
          fi
