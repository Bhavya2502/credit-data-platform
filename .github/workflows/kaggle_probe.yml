name: Kaggle access probe

# Reports which Kaggle targets the credentials can actually reach, before any
# multi-gigabyte download is attempted. Competition data additionally requires
# browser rule-acceptance, which the API surfaces only as a bare 403.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx~=0.27" "tenacity~=9.0"

      - name: Probe Kaggle access
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/kaggle_probe.py
