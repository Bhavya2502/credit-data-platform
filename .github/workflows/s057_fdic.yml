name: S-057 FDIC BankFind

# Bank-level quarterly credit performance for every US insured institution.
# Scheduled refresh picks up each quarter's publication; backfill is run
# manually via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "latest = recent quarters · backfill = full history from 1992"
        type: choice
        options: [latest, backfill]
        default: latest
      limit:
        description: "Cap number of quarters processed (0 = no cap)"
        type: string
        default: "0"
  schedule:
    # FDIC publishes ~8-10 weeks after quarter end. Check mid-month in the
    # months following each quarter close.
    - cron: "0 6 15 3,6,9,12 *"

concurrency:
  # Never let a scheduled run collide with a manual backfill mid-write.
  group: s057-fdic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "boto3~=1.35" "duckdb~=1.1" "httpx~=0.27" "tenacity~=9.0" \
                      "pandas~=2.2" "pyarrow~=17.0" "pyyaml~=6.0"

      - name: Run pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python pipelines/s057_fdic.py \
            --mode "${{ inputs.mode || 'latest' }}" \
            --limit "${{ inputs.limit || '0' }}"
