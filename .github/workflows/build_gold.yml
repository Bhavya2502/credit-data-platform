name: Build gold layer

# Rebuilds analysis-ready gold tables from loaded silver data.
on:
  workflow_dispatch:
  workflow_run:
    # Runs automatically after a successful source load.
    workflows: ["S-057 FDIC BankFind"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when the upstream load failed — never rebuild gold on bad silver.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb~=1.1" "pandas~=2.2" "boto3~=1.35" "pyyaml~=6.0"

      - name: Build gold tables
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipelines/build_gold.py
