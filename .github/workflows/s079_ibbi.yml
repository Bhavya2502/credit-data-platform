name: S-079 IBBI newsletters

# Case-level insolvency outcomes — India's only public workout-LGD micro data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "latest = 2 newest · backfill = all 37 · periods = specific"
        type: choice
        options: [latest, backfill, periods]
        default: latest
      limit:
        description: "Cap editions processed (0 = no cap)"
        type: string
        default: "0"
      periods:
        description: "Space-separated slugs, e.g. 2024Q1 2023Q2 (mode=periods)"
        type: string
        default: ""
  schedule:
    # IBBI publishes roughly two months after quarter end.
    - cron: "0 4 20 3,6,9,12 *"

concurrency:
  group: s079-ibbi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # 37 editions, some 36 MB, PDF parsing is slow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "boto3~=1.35" "duckdb~=1.1" "httpx~=0.27" "tenacity~=9.0" \
                      "pandas~=2.2" "pyarrow~=17.0" "pyyaml~=6.0" "pdfplumber~=0.11"

      - name: Run pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python pipelines/s079_ibbi.py \
            --mode "${{ inputs.mode || 'latest' }}" \
            --limit "${{ inputs.limit || '0' }}"
